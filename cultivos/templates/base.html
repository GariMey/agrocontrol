<!-- cultivos/templates/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}AgroControl{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #2c3e50 0%, #1a472a 100%);
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background: #27ae60;
            padding-left: 30px;
        }
        .card-stats {
            border-left: 4px solid #27ae60;
            transition: 0.3s;
        }
        .card-stats:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        footer {
            background: #2c3e50;
            color: white;
            padding: 20px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 p-0 sidebar">
                <div class="text-center py-4">
                    <i class="fas fa-seedling fa-3x text-success"></i>
                    <h4 class="text-white mt-2">AgroControl</h4>
                </div>
                <nav>
                <a href="{% url 'inicio' %}">
                    <i class="fas fa-home"></i> Inicio
                </a>
                <a href="{% url 'lista_cultivos' %}">
                    <i class="fas fa-leaf"></i> Cultivos
                </a>
                <a href="{% url 'buscar_cultivos' %}">
                    <i class="fas fa-search"></i> Buscar
                </a>
                <a href="{% url 'dashboard_completo' %}">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="{% url 'calendario_siembra' %}">
                    <i class="fas fa-calendar-alt"></i> Calendario
                </a>
                <a href="{% url 'comparar_cultivos' %}">
                    <i class="fas fa-chart-simple"></i> Comparar
                </a>
                <a href="/admin">
                    <i class="fas fa-user-shield"></i> Admin
                </a>
            </nav>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-10 p-0">
                <nav class="navbar navbar-light bg-light px-3">
                    <span class="navbar-brand">
                        <i class="fas fa-tractor"></i> Sistema de Gestión Agrícola
                    </span>
                </nav>
                
                <div class="container mt-4">
                    {% block contenido %}
                    {% endblock %}
                </div>
                
                <footer class="text-center">
                    <p>&copy; 2024 AgroControl - Gestión Inteligente de Cultivos</p>
                </footer>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
